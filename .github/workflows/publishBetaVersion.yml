name: Publish beta version to npm

on:
  workflow_dispatch:

jobs:
  test:
    name: Publish beta version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm install
      - name: Bump prerelease version
        run: npm version prerelease --preid=beta --no-git-tag-version
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --tag beta --access public
      - name: Commit version bump
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${VERSION} [skip ci]"
          git push
      - name: Publish Beta Failure
        if: ${{ failure() }}
        shell: bash
        env:
          CHANNEL: 'deployments'
          TITLE: 'workflow-failed'
          REPOSITORY_NAME: 'mobstac-awesome-qr'
          RUN_ID: ${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          COLOR: '#FF0000'
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl --request POST \
            --url $SLACK_WEBHOOK_URL \
            --header 'Content-Type: application/json' \
            --header 'cache-control: no-cache' \
            --data "{\"channel\":\"${CHANNEL}\", \"attachments\": [ { \"title\":\"${TITLE} [ ${GITHUB_REF##*/} ] : [ ${ACTOR} ]\", \"text\": \"https://github.com/mobstac/${REPOSITORY_NAME}/actions/runs/${RUN_ID}\", \"color\": \"${COLOR}\" } ]}"
